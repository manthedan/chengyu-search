<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chengyu Search — findchengyu.com</title>
  <desc id="desc">Brand banner for Chengyu Search, the Chinese idiom search app hosted at findchengyu.com.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F2E8"/>
      <stop offset="1" stop-color="#EEE5D7"/>
    </linearGradient>
    <radialGradient id="washA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 120) rotate(34) scale(420 240)">
      <stop stop-color="#B23A2C" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#B23A2C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 420) rotate(-18) scale(360 220)">
      <stop stop-color="#7A7B46" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7A7B46" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1A1613" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1160" height="480" rx="20" fill="url(#paper)" stroke="#E4DBC7" filter="url(#shadow)"/>
  <rect x="20" y="20" width="1160" height="480" rx="20" fill="url(#washA)"/>
  <rect x="20" y="20" width="1160" height="480" rx="20" fill="url(#washB)"/>

  <rect x="92" y="126" width="132" height="132" rx="10" fill="#B23A2C" transform="rotate(-2 92 126)"/>
  <rect x="103" y="137" width="110" height="110" rx="6" stroke="rgba(255,255,255,0.35)" stroke-width="4" transform="rotate(-2 103 137)"/>
  <text x="157" y="214" text-anchor="middle" fill="#FFF7EA" font-size="70" font-family="'Noto Serif SC','Songti SC',serif" font-weight="700" transform="rotate(-2 157 214)">成</text>

  <text x="292" y="170" fill="#6B6055" font-size="30" font-family="'Noto Serif SC','Songti SC',serif" letter-spacing="6">成语搜索</text>
  <text x="292" y="250" fill="#1A1613" font-size="76" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700">Chengyu Search</text>
  <text x="294" y="302" fill="#8E2A1E" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="600" letter-spacing="1.5">findchengyu.com</text>

  <text x="294" y="364" fill="#3A332C" font-size="28" font-family="Inter, Arial, sans-serif">Search Chinese idioms by meaning, characters, or pinyin.</text>
  <text x="294" y="410" fill="#6B6055" font-size="22" font-family="Inter, Arial, sans-serif">The product is Chengyu Search. The canonical home is findchengyu.com.</text>
</svg>
