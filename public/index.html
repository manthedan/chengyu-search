    <script>
        // One-time hero entrance, started on the prerendered page before first
        // paint. app.js calls play() again only if its first render replaces
        // these characters; sharing startTime continues the same entrance.
        (function () {
            var timeline = document.timeline;
            var startTime = timeline && typeof timeline.currentTime === 'number' ? timeline.currentTime : null;
            function play() {
                if (startTime === null) return;
                if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                var characters = document.querySelectorAll('.hero-character');
                for (var i = 0; i < characters.length; i++) {
                    if (typeof characters[i].animate !== 'function') continue;
                    characters[i].animate([{ opacity: 0 }, { opacity: 1 }], {
                        duration: 420, delay: i * 55, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'backwards'
                    }).startTime = startTime;
                }
            }
            window.ChengyuHeroEntrance = { play: play };
            play();
        })();
    </script>
